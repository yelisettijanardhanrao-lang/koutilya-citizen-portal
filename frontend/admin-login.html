<!doctype html><html lang="en"><head><script src="/api-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Koutilya Solutions — Admin</title><link rel="stylesheet" href="/assets/portal.css"></head><body><main class="auth"><section class="auth-card"><div class="brand"><div class="brand-mark">KS</div><div><strong>Koutilya Solutions</strong><small>Secure Administration</small></div></div><h1>Admin Login</h1><p>Authorized administrators only.</p><div class="field"><label>User ID</label><input id="uid" autocomplete="username"></div><div class="field"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><label style="display:flex;align-items:center;gap:7px;margin-top:8px;font-weight:600;font-size:12px;color:#526579;cursor:pointer"><input id="showPw" type="checkbox" style="width:auto;margin:0"> Show password</label></div><button class="primary" id="login">Login</button><div id="msg" class="msg hidden"></div></section></main><script>document.getElementById('login').onclick=async()=>{const msg=document.getElementById('msg');msg.className='msg';msg.textContent='Checking…';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid.value,password:pw.value})});const j=await r.json();if(!r.ok)throw Error(j.message||'Login failed');if(j.authToken)localStorage.setItem('kspl_auth_token',j.authToken);location.href='/admin/dashboard';}catch(e){msg.className='msg err';msg.textContent=e.message}}document.getElementById('showPw').addEventListener('change',e=>{document.getElementById('pw').type=e.target.checked?'text':'password';});</script></body></html>
