<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Citizen Application</title><link rel="stylesheet" href="state-application-ui.css"></head><body><main class="app-shell" data-state-application><header class="top"><div class="emblem">STATE<br>GOVT<br>EMBLEM</div><div class="heading"><h1 id="stateTitle">Government Application</h1><h2 id="deptTitle">Citizen Service Application</h2><p id="serviceTitle"></p></div></header><div class="toolbar"><select id="language" aria-label="Language"></select><select id="service" aria-label="Application"></select></div><section class="section aadhaar-box"><div class="section-title">Aadhaar Autofill / ஆதார் தானியங்கி நிரப்பு</div><div class="aadhaar-row"><div class="field"><label>Upload Aadhaar Image</label><input type="file" accept="image/*" data-aadhaar-file></div><button class="autofill" type="button" data-autofill>Autofill Applicant Details</button></div><div class="note">Only applicable applicant fields are autofilled. Review and correct before continuing.</div></section><section class="section"><div class="section-title">1. Applicant Details</div><div class="grid"><div class="field"><label class="required">Full Name</label><input data-field="full_name"></div><div class="field"><label>Father Name</label><input data-field="father_name"></div><div class="field"><label>Date of Birth</label><input type="date" data-field="date_of_birth"></div><div class="field"><label>Gender</label><select data-field="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label>Aadhaar Number</label><input data-field="aadhaar_number" inputmode="numeric" maxlength="12"></div><div class="field"><label>Mobile Number</label><input data-field="mobile" inputmode="tel"></div></div></section><section class="section"><div class="section-title">2. Address Details</div><div class="grid"><div class="field"><label>Address</label><input data-field="address"></div><div class="field"><label>District</label><input data-field="district"></div><div class="field"><label>Taluk / Mandal</label><input data-field="taluk"></div><div class="field"><label>Village / Town / Ward</label><input data-field="village"></div><div class="field"><label>PIN Code</label><input data-field="pincode" inputmode="numeric"></div></div></section><section class="section"><div class="section-title">3. Application-specific Details</div><div id="serviceFields" class="grid"></div></section><section class="section"><div class="section-title">4. Declaration / Consent</div><div class="field"><label><input type="checkbox" id="consent"> I declare that the information provided is true and correct and I agree to the applicable terms.</label></div></section><div class="actions"><button type="button">Clear</button><button type="button">Preview</button><button type="button" class="primary">Generate PDF</button></div></main><script src="state-application-config.js"></script><script src="state-application-autofill.js"></script><script>(function(){const q=new URLSearchParams(location.search);const state=q.get('state')||'tamil_nadu';const cfg=window.CSP_STATE_APPLICATIONS[state];if(!cfg)return;const $=s=>document.querySelector(s);$('#stateTitle').textContent=cfg.state+' Government';$('#deptTitle').textContent=state==='tamil_nadu'?'Revenue Administration':'Nadakacheri / Revenue Services';cfg.langs.forEach(x=>$('#language').add(new Option(x,x)));cfg.services.forEach(x=>$('#service').add(new Option((x.code?x.code+' — ':'')+x.name,x.id)));function render(){const s=cfg.services.find(x=>x.id===$('#service').value)||cfg.services[0];$('#serviceTitle').textContent=s.name;const box=$('#serviceFields');box.innerHTML='';s.fields.forEach(key=>{const d=document.createElement('div');d.className='field';const l=document.createElement('label');l.textContent=key.replaceAll('_',' ').replace(/\b\w/g,m=>m.toUpperCase());const i=document.createElement('input');i.dataset.field=key;d.append(l,i);box.append(d)});}$('#service').addEventListener('change',render);render();})();</script></body></html>
